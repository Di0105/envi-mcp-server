[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "envi-mcp-server"
version = "0.1.0"
description = "FastMCP server and scripts for ENVI/SARScape task automation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Di0105" }
]
keywords = ["ENVI", "SARScape", "MCP", "FastMCP", "InSAR", "SAR", "DEM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows"
]
dependencies = [
  "pydantic>=2.6",
  "envipyengine",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/Di0105/envi-mcp-server"
Repository = "https://github.com/Di0105/envi-mcp-server"
Issues = "https://github.com/Di0105/envi-mcp-server/issues"

[project.optional-dependencies]
mcp = [
  "fastmcp>=2.0; python_version >= '3.10'"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
compare = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "rasterio>=1.3"
]

[project.scripts]
envi-mcp-server = "envi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"